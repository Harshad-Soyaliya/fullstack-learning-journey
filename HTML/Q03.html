<!-- Build a signup form with text, email, password, a select, radio group, checkbox, textarea, and a submit button. Check each field has a label and a name . -->



<!Doctype html>
<html>
    <head>
        <title>
            Signup | Harshad
        </title>
    </head>
    <body>
        <header>
            <h1>Signup</h1>
        </header>

        <main>

            <section>

            <article>
            <form>
                <label for="username">Username : </label>
                <input type="text" name="username" id="username" required>

                <br/><br/>

                <label for="email">Email : </label>
                <input type="email" name="email" id="email" required >

                <br/><br/>

                <label for="gender">Gender : </label>
                <label><input type="radio" name="gender" id="username" value="female">Female</label>
                <label><input type="radio" name="gender" id="username" value="male">Male</label>
                <label><input type="radio" name="gender" id="username" value="other">Other</label>
            
                <br/><br/>

                <label for="City">City : </label>
                <select name="City" id="City">
                    <option value="choose...">choose...</option>
                    <option value="rajkot">rajkot</option>
                    <option value="ahemdabad">ahemdabad</option>
                </select>

                <br/><br/>

                <label for="address">Address : </label>
                <textarea  rows="2" name="address" id="address"></textarea>

                <br/><br/>

                <label for="psw">password :</label>
                <input type="password" name="password" id="psw" required>

                <br/><br/>

                <label for="term"><input type="checkbox" name="termandcondition" id="term" required>Term and condition</label>

                <br/><br/>

                <button type="submit" name="submit" id="submit">Signup</button>
               
            </form>
                
            </article>

            </section>

            
        </main>

        <footer>

        </footer>
    </body>
</html>
