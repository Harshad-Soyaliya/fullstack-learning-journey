<!-- Make a badge sit in the top-right corner of a card using relative and absolute. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge | Harshad</title>
    <style>
        .container{
            border: 1px solid black;
            padding: 5px;
            height: 500px;
            width: 500px;
            position: relative;

        }

        .badge{
            background-color: bisque;
            border: 1px solid black;
            text-align: center;
            width: max-content;
            height: max-content;
            padding: 5px;
            position: absolute;
            right: 1px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="badge">
            <h1>Badge</h1>
        </div>
    </div>
</body>
</html>
