<!-- Centre a box horizontally and vertically using Flexbox. Then do it again using Grid ( place-items: center ). -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox and grid | Harshad</title>

    <style>
        #Container{
            border: 1px solid black;
            height: 55vh;
            

            /* using flex box */

            /*

            display: flex;
            justify-content: center;
            align-items: center;

            /*

            /* using grid */

            display: grid;
            place-items: center;

        }

        #Box{
            background-color: blanchedalmond;
            width: 100px;
            height: 100px;
            text-align: center;
        }
    </style>
</head>
<body>
    
    <div id="Container">
        <div id="Box">Box</div>
    </div>
</body>
</html>
