 <!-- Make a navbar that sticks to the top when you scroll. -->

 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar | Harshad</title>
    <style>
        ul{
            list-style: none;
            display: flex;
            justify-content: space-around;
        }

        nav{
            height: 55px;
            border-radius: 21px;
            padding: 5px;
            background-color: #f1e8d6;
            position: sticky;
        }

        button{
            background-color: #f4deb2;
            padding: 5px 12px;
            border: none;
            border-radius: 12px;
        }
    </style>
 </head>
 <body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Service</li>
                <li>Contact</li>
                <li><button>Register</button></li>
            </ul>
        </nav>
    </header>
 </body>
 </html>
