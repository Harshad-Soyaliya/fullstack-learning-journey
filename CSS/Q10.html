<!-- Add a hover transition on the cards and a fade-in animation. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #tra {
            border: 1px solid black;
            background-color: red;
            width: 300px;
            height: 300px;
            transition: width 10s , height 5s , background-color 8s ;
            
        }

        #ani
        {
            margin-top: 50px;
            border: 1px solid black;
            background-color: red;
            width: 300px;
            height: 300px;
            animation: harshad 1s ease-in infinite;
        }

        @keyframes harshad {
            from {opacity: 0;}
            to {opacity: 1;}
        }
        #tra:hover{
            width: 500px;
            height: 500px;
            background-color: brown;
        }

    </style>
</head>
<body>
    <div id="tra"></div>
    <div id="ani"></div>
</body>
</html>
